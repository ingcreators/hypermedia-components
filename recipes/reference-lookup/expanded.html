<!-- Fully expanded HTML — the field in its three states plus the
  dialog the server returns for the 🔍 button. -->

<!-- Resolved: hint carries the display name, hidden id filled. -->
<div class="hc-field" id="customer-field" data-hc-lookup>
  <label class="hc-field__label" for="customer-code">Customer</label>
  <div class="hc-input-group">
    <input class="hc-input" id="customer-code" name="customer_code" value="C-1041"
           data-hx-get="/customers/resolve" data-hx-trigger="change"
           data-hx-target="#customer-field" data-hx-swap="outerHTML">
    <button class="hc-button" type="button" aria-haspopup="dialog"
            aria-label="Search customers"
            data-hx-get="/customers/lookup"
            data-hx-target="#lookup-root" data-hx-swap="innerHTML">🔍</button>
  </div>
  <p class="hc-field__hint">Acme Trading K.K.</p>
  <input type="hidden" name="customer_id" value="cus_9f2">
</div>

<!-- Unresolved (the 422 shape): aria-invalid, message instead of
     hint, and the hidden id is EMPTY — never a stale identity under
     a code the server did not recognise. -->
<div class="hc-field" id="customer-field-invalid-variant" data-hc-lookup>
  <label class="hc-field__label" for="customer-code-invalid">Customer</label>
  <div class="hc-input-group">
    <input class="hc-input" id="customer-code-invalid" name="customer_code" value="C-9999"
           aria-invalid="true"
           data-hx-get="/customers/resolve" data-hx-trigger="change"
           data-hx-target="#customer-field-invalid-variant" data-hx-swap="outerHTML">
    <button class="hc-button" type="button" aria-haspopup="dialog"
            aria-label="Search customers"
            data-hx-get="/customers/lookup"
            data-hx-target="#lookup-root" data-hx-swap="innerHTML">🔍</button>
  </div>
  <p class="hc-field__message" data-variant="error">No customer with code C-9999.</p>
  <input type="hidden" name="customer_id" value="">
</div>

<div id="lookup-root" data-hc-remote-dialog-root>
  <!-- What GET /customers/lookup returns — a remote-dialog whose
       search is live-search and whose rows re-render the FIELD: -->
  <dialog class="hc-dialog" data-hc-close-dialog-on-success
          aria-labelledby="lookup-title">
    <h2 id="lookup-title">Select a customer</h2>
    <form role="search" action="/customers/lookup" method="get">
      <input class="hc-input" type="search" name="q" placeholder="Code or name"
             aria-label="Search customers"
             data-hx-get="/customers/lookup/results"
             data-hx-trigger="input changed delay:300ms, search"
             data-hx-target="#lookup-results" data-hx-swap="innerHTML"
             data-hx-sync="closest form:replace">
    </form>
    <ul class="hc-menu" id="lookup-results">
      <!-- Picking a row swaps the field (outerHTML); the successful
           request also closes the dialog (close-on-success). -->
      <li><button class="hc-menu__item" type="button"
                  data-hx-get="/customers/pick?id=cus_9f2"
                  data-hx-target="#customer-field" data-hx-swap="outerHTML">
        C-1041 — Acme Trading K.K.</button></li>
      <!-- Inactive master rows render visible but refused — a reason
           beats silently missing: -->
      <li><button class="hc-menu__item" type="button" aria-disabled="true">
        C-1042 — Vanished Corp. (inactive since 2026-04)</button></li>
    </ul>
    <form method="dialog"><button class="hc-button">Cancel</button></form>
  </dialog>
</div>
