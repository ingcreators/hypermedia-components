<!-- Fully expanded HTML — the recalc loop plus the save button and
  the 422 shape. The server renders THIS WHOLE FORM on every
  response; the client never computes a number. -->
<form method="post" action="/quotes/42/recalc" id="quote" data-hc-line-items>
  <table class="hc-table">
    <thead>
      <tr>
        <th scope="col">Item</th>
        <th scope="col">Qty</th>
        <th scope="col">Unit price</th>
        <th scope="col">Line total</th>
        <th scope="col"><span aria-hidden="true"></span></th>
      </tr>
    </thead>
    <tbody>
      <!-- A valid row: -->
      <tr>
        <td><input class="hc-input" name="item" value="Widget" aria-label="Item"></td>
        <td><input class="hc-input" name="qty" value="3" inputmode="numeric" aria-label="Quantity"
                   data-hx-post="/quotes/42/recalc" data-hx-trigger="change"
                   data-hx-target="#quote" data-hx-swap="outerHTML"></td>
        <td><input class="hc-input" name="price" value="1200" inputmode="numeric" aria-label="Unit price"
                   data-hx-post="/quotes/42/recalc" data-hx-trigger="change"
                   data-hx-target="#quote" data-hx-swap="outerHTML"></td>
        <td data-cell="line-total">¥3,600</td>
        <td><button class="hc-button" data-variant="ghost" type="submit" name="remove" value="1"
                    data-hx-post="/quotes/42/recalc"
                    data-hx-target="#quote" data-hx-swap="outerHTML">Remove</button></td>
      </tr>
      <!-- The 422 shape — the server echoes the bad raw value back,
           marks the input, and puts the message in the row: -->
      <tr>
        <td><input class="hc-input" name="item" value="Gasket" aria-label="Item"></td>
        <td><input class="hc-input" name="qty" value="3..5" inputmode="numeric" aria-label="Quantity"
                   aria-invalid="true"
                   data-hx-post="/quotes/42/recalc" data-hx-trigger="change"
                   data-hx-target="#quote" data-hx-swap="outerHTML"></td>
        <td><input class="hc-input" name="price" value="800" inputmode="numeric" aria-label="Unit price"
                   data-hx-post="/quotes/42/recalc" data-hx-trigger="change"
                   data-hx-target="#quote" data-hx-swap="outerHTML"></td>
        <td data-cell="line-total">
          <span class="hc-field__message" data-variant="error">Quantity must be a whole number.</span>
        </td>
        <td><button class="hc-button" data-variant="ghost" type="submit" name="remove" value="2"
                    data-hx-post="/quotes/42/recalc"
                    data-hx-target="#quote" data-hx-swap="outerHTML">Remove</button></td>
      </tr>
    </tbody>
    <tfoot>
      <!-- Totals come from the server; while any row is invalid they
           render "—", never a stale or client-computed number. -->
      <tr><th scope="row" colspan="3">Subtotal</th><td>—</td><td></td></tr>
      <tr><th scope="row" colspan="3">Tax (10%)</th><td>—</td><td></td></tr>
      <tr><th scope="row" colspan="3">Total</th><td>—</td><td></td></tr>
    </tfoot>
  </table>

  <div class="hc-cluster">
    <button class="hc-button" type="submit" name="add" value="1"
            data-hx-post="/quotes/42/recalc"
            data-hx-target="#quote" data-hx-swap="outerHTML">Add row</button>
    <!-- Save is a different endpoint — formaction is the no-JS path.
         It validates like recalc (422, same shape) and succeeds per
         mutating-form (redirect / success swap). -->
    <button class="hc-button" data-variant="primary" type="submit"
            formaction="/quotes/42" data-hx-post="/quotes/42"
            data-hx-target="#quote" data-hx-swap="outerHTML">Save quote</button>
  </div>
</form>
