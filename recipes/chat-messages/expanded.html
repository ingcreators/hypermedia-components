<!-- Expanded form — a full exchange in the DOM.

  The 200 response to the composer POST is three fragments in one
  body: the user <li>, the assistant placeholder <li> (aria-busy,
  data-state="streaming"), both appended via beforeend, and the fresh
  composer re-rendered out of band. The placeholder's id is the handle
  the streaming-response recipe connects to. -->
<div class="hc-chat" role="log" aria-label="Conversation">
  <ol class="hc-chat__list" tabindex="0" id="chat-list">
    <li class="hc-chat__message" data-role="user">
      <div class="hc-chat__body">What failed in CI?</div>
      <div class="hc-chat__meta"><time datetime="2026-07-05T14:03">14:03</time></div>
    </li>
    <li class="hc-chat__message" data-role="assistant" data-state="streaming"
        aria-busy="true" id="reply-42">
      <div class="hc-chat__body"></div>
    </li>
  </ol>
  <button class="hc-chat__jump hc-button" data-size="sm" type="button">↓ Latest</button>

  <!-- 422 re-render of the composer (out of band; the only 422 payload) -->
  <form class="hc-field" id="composer" method="post" action="/chat/messages"
        data-hx-post="/chat/messages"
        data-hx-target="#chat-list" data-hx-swap="beforeend"
        data-hx-swap-oob="outerHTML" data-invalid="true">
    <label class="hc-field__label" for="prompt">Message</label>
    <textarea class="hc-input" id="prompt" name="prompt" rows="2"
              aria-invalid="true" aria-describedby="prompt-error"></textarea>
    <p id="prompt-error" class="hc-field__message">Type a message first.</p>
    <button class="hc-button" data-variant="primary" type="submit">Send</button>
  </form>
</div>
