<!-- Short recommended usage. The <table> is the data source AND the
     no-JavaScript / no-Plot accessible fallback. installChart() reads it
     and draws the chart. -->
<figure class="hc-chart" data-hc-chart="bar" data-y-label="売上 (万円)">
  <table class="hc-table">
    <caption>月次売上</caption>
    <thead>
      <tr><th>月</th><th>売上</th></tr>
    </thead>
    <tbody>
      <tr><td>1月</td><td>120</td></tr>
      <tr><td>2月</td><td>200</td></tr>
      <tr><td>3月</td><td>150</td></tr>
    </tbody>
  </table>
</figure>
