<!-- Fully expanded HTML — the host, a guarded form, and what the
  behavior renders into the host when a request gets no answer.
  The host is CLIENT-OWNED: it ships empty and the behavior writes
  into it; the server never renders this alert (there is no server
  response to render from — that is the whole point). -->
<div data-hc-network-retry></div>

<form method="post" action="/orders"
      data-hx-post="/orders" data-hx-request='{"timeout": 10000}'
      data-hx-target="#order-result" data-hx-swap="innerHTML"
      data-hx-disabled-elt="find button[type=submit]">
  <input type="hidden" name="idempotency_key" value="ik_7d1f9c2e">

  <div class="hc-field">
    <label class="hc-field__label" for="amount">Amount</label>
    <input class="hc-input" id="amount" name="amount" value="1200" inputmode="numeric">
  </div>

  <button class="hc-button" data-variant="primary" type="submit">Place order</button>
</form>

<div id="order-result" aria-live="polite"></div>

<!-- What installNetworkRetry() renders into the host on
  htmx:sendError / htmx:timeout (strings come from the i18n catalog —
  networkRetry.failed / networkRetry.retry — or the host's
  data-hc-network-retry-message / -label overrides):

<div data-hc-network-retry>
  <div class="hc-alert" data-variant="error" role="status">
    <p class="hc-alert__title">The request didn't reach the server —
      check your connection and retry.</p>
    <button class="hc-button" type="button" data-hc-network-retry-now>Retry</button>
  </div>
</div>

  Retry re-issues the request from its source element with its
  current values via htmx.ajax(). Any real response on that element —
  success or error — clears the alert: an error WITH a status belongs
  to the errors map, not to this banner. -->
