<!-- Short recommended usage.

  network-retry: the request that got NO answer at all — airplane
  mode, a dropped socket, a declared timeout. Every other error
  contract assumes a response arrived; this one owns the case where
  none did. htmx surfaces it as htmx:sendError / htmx:timeout;
  installNetworkRetry() renders a retry alert into the host below
  and the Retry button re-issues the failed request with its CURRENT
  input values (a fresh attempt, not a byte replay — the form's
  idempotency_key rides along unchanged, which is what makes
  retrying a POST safe). Timeouts are opt-in: declare one with
  data-hx-request (or htmx.config.timeout); without one, only hard
  send failures fire. -->
<div data-hc-network-retry></div>

<form method="post" action="/orders"
      data-hx-post="/orders" data-hx-request='{"timeout": 10000}'
      data-hx-target="#order-result" data-hx-swap="innerHTML"
      data-hx-disabled-elt="find button[type=submit]">
  <input type="hidden" name="idempotency_key" value="ik_7d1f9c2e">
  <!-- …fields… -->
  <button class="hc-button" data-variant="primary" type="submit">Place order</button>
</form>

<div id="order-result" aria-live="polite"></div>
