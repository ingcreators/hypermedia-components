<!-- Fully expanded HTML.

  Three trigger variants for the same "load on first reveal" pattern.
  Pick the one that matches how the panel becomes relevant. -->

<!-- Variant 1 — on intersection (panel scrolls into view).
     `intersect once threshold:0.25` waits until 25% is visible. -->
<section
  data-hx-get="/dashboards/usage"
  data-hx-trigger="intersect once"
  data-hx-swap="innerHTML"
  data-hx-indicator="this">
  <p class="hc-field__message">Loading when visible…</p>
</section>

<!-- Variant 2 — on <details> open (accordion).
     `from:closest details` listens for the toggle on the ancestor.
     `once` makes sure the fetch never repeats. -->
<details>
  <summary>Advanced settings</summary>
  <div
    data-hx-get="/settings/advanced"
    data-hx-trigger="toggle from:closest details once"
    data-hx-swap="innerHTML"
    data-hx-indicator="this">
    <p class="hc-field__message">Loading…</p>
  </div>
</details>

<!-- Variant 3 — on tab activation (hc-tabs).
     The hc-tabs behavior (installTabs, auto-init bundle) owns the
     aria-selected / hidden flipping and dispatches `hc:tabactivated`
     on a panel each time it becomes active. `once` makes sure the
     fetch never repeats. -->
<div class="hc-tabs">
  <div class="hc-tabs__list" role="tablist" aria-label="Reports">
    <button type="button" class="hc-tabs__tab" role="tab"
      id="tab-overview" aria-controls="panel-overview"
      aria-selected="true" tabindex="0">
      Overview
    </button>
    <button type="button" class="hc-tabs__tab" role="tab"
      id="tab-revenue" aria-controls="panel-revenue"
      aria-selected="false" tabindex="-1">
      Revenue
    </button>
  </div>

  <div class="hc-tabs__panel" role="tabpanel"
    id="panel-overview" aria-labelledby="tab-overview" tabindex="0"
    data-hx-get="/reports/overview"
    data-hx-trigger="load"
    data-hx-swap="innerHTML"
    data-hx-indicator="this">
    <p class="hc-field__message">Loading…</p>
  </div>
  <div class="hc-tabs__panel" role="tabpanel"
    id="panel-revenue" aria-labelledby="tab-revenue"
    tabindex="0" hidden="until-found"
    data-hx-get="/reports/revenue"
    data-hx-trigger="hc:tabactivated once"
    data-hx-swap="innerHTML"
    data-hx-indicator="this">
    <p class="hc-field__message">Loading…</p>
  </div>
</div>
