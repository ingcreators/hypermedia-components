<!-- Expanded state: the upload answered with a validation report
  (3 of 5 rows valid). Nothing is imported yet — the summary line, the
  error table (real <table>, row/field/message), and the confirm form
  whose hidden token references the server-held parsed batch. The
  commit response replaces this report with a result summary + an
  HX-Trigger toast; a stale/consumed token answers 409 + a re-upload
  hint (tokens are single-shot). -->
<form id="csv-upload" method="post" action="/imports"
      enctype="multipart/form-data"
      data-hx-post="/imports"
      data-hx-encoding="multipart/form-data"
      data-hx-target="#import-report"
      data-hx-indicator="find progress"
      data-hx-disabled-elt="find button[type=submit]">
  <div class="hc-field">
    <label class="hc-field__label" for="csv">CSV file</label>
    <input class="hc-input" id="csv" name="csv" type="file" required
           accept=".csv,text/csv">
  </div>

  <progress class="hc-progress htmx-indicator" data-hc-upload-progress
            value="0" max="100" aria-label="Upload progress"></progress>

  <button class="hc-button" data-variant="primary" type="submit">Upload</button>
</form>

<!-- Server response for POST /imports — this slot's innerHTML. -->
<div id="import-report" aria-live="polite">
  <p>3 of 5 rows ready — 2 rows have errors and will be skipped.</p>

  <table class="hc-table">
    <caption>Rows that will not be imported</caption>
    <thead>
      <tr>
        <th scope="col">Row</th>
        <th scope="col">Field</th>
        <th scope="col">Message</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">3</th>
        <td>qty</td>
        <td>qty must be a positive integer</td>
      </tr>
      <tr>
        <th scope="row">5</th>
        <td>name</td>
        <td>name is required</td>
      </tr>
    </tbody>
  </table>

  <form method="post" action="/imports/TmV4dCBiYXRjaA/commit"
        data-hx-post="/imports/TmV4dCBiYXRjaA/commit"
        data-hx-target="#import-report"
        data-hx-disabled-elt="find button[type=submit]">
    <input type="hidden" name="token" value="TmV4dCBiYXRjaA">
    <button class="hc-button" data-variant="primary" type="submit">
      Import the valid 3 rows
    </button>
  </form>
</div>
