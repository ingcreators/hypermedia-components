<!-- Short recommended usage.

  Saved views: the current search's querystring, named and kept
  server-side. Saving posts the filter form's pairs (data-hx-include)
  plus a name; the server stores them per user and answers the views
  strip. Applying a view is a plain GET link — bookmarkable, shareable,
  zero client state — whose response re-renders the filter form with
  the controls filled, so a view is never opaque. Deleting answers the
  strip without it. Zero custom JS; see contract.md. -->
<form id="filters" action="/items" method="get"
      data-hx-get="/items"
      data-hx-target="#results">
  <div class="hc-field">
    <label class="hc-field__label" for="q">Search</label>
    <input class="hc-input" id="q" name="q" type="search">
  </div>
  <div class="hc-field">
    <label class="hc-field__label" for="status">Status</label>
    <select class="hc-select" id="status" name="status">
      <option value="">All</option>
      <option value="active">Active</option>
      <option value="pending">Pending</option>
      <option value="failed">Failed</option>
    </select>
  </div>
  <button class="hc-button" type="submit">Apply</button>
</form>

<!-- Save the filters above under a name; the response re-renders the
     #views strip with the new chip marked current. -->
<form method="post" action="/views"
      data-hx-post="/views"
      data-hx-include="#filters"
      data-hx-target="#views"
      data-hx-disabled-elt="find button[type=submit]">
  <div class="hc-field">
    <label class="hc-field__label" for="view-name">View name</label>
    <input class="hc-input" id="view-name" name="name" required>
  </div>

  <!-- Naming is not the only decision at save time. SCOPE, because a
       department standard is the normal case in business software and
       silently forking a colleague's view is an accident; DEFAULT,
       because a screen that opens on the wrong question wastes a step
       every day (the server then 303s the bare list URL to it, so the
       address bar still shows the real conditions). -->
  <fieldset class="hc-field">
    <legend class="hc-field__label">Who can see it</legend>
    <label class="hc-radio-label">
      <input class="hc-radio" type="radio" name="scope" value="personal" checked>
      Only me
    </label>
    <label class="hc-radio-label">
      <input class="hc-radio" type="radio" name="scope" value="shared">
      My team
    </label>
  </fieldset>

  <label class="hc-checkbox-label">
    <input class="hc-checkbox" type="checkbox" name="default" value="1">
    Open this screen on it
  </label>

  <button class="hc-button" data-variant="primary" type="submit">Save view</button>
</form>

<!-- The server-rendered views strip; POST /views and DELETE /views/…
     both answer this region's contents. -->
<div id="views">
  <ul class="hc-chips">
    <li class="hc-chip">
      <a href="/items?view=quarterly"
         data-hx-get="/items?view=quarterly"
         data-hx-target="#results">quarterly</a>
      <!-- A view IS a URL, so sharing one costs nothing. Reserve
           shared views for standards that outlive a conversation. -->
      <button class="hc-button" data-size="sm" type="button"
              data-hc-copy-text="https://app.example.com/items?view=quarterly"
              aria-label="Copy link to quarterly">Copy link</button>
      <button class="hc-button" data-size="sm" type="button"
              aria-label="Delete view quarterly"
              data-hx-delete="/views/quarterly"
              data-hx-target="#views">×</button>
    </li>
  </ul>
</div>

<div id="results" aria-live="polite"></div>
