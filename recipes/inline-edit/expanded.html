<!-- Fully expanded HTML.

  Three server-rendered fragments at the same id share one DOM slot;
  htmx swaps between them with `outerHTML`. No client behavior beyond
  htmx itself. -->

<!-- 1. Display state (initial render and after successful save).
     URL: GET /items/42/name
     The Edit button is the affordance — a real <button>, keyboard
     reachable. It targets `closest span`, so activating it replaces
     the whole display node with the edit form. -->
<span id="item-42-name">
  Acme widgets
  <button class="hc-button" data-size="sm" type="button"
    data-hx-get="/items/42/name/edit"
    data-hx-target="closest span"
    data-hx-swap="outerHTML">
    Edit
  </button>
</span>

<!-- 2. Edit state (returned by GET /items/42/name/edit).
     Cancel targets `closest form`, swapping the whole edit form back
     to the display fragment. -->
<form
  id="item-42-name"
  data-hx-put="/items/42/name"
  data-hx-target="this"
  data-hx-swap="outerHTML"
  style="display: inline-flex; gap: .25rem;">
  <input
    name="name"
    class="hc-input"
    data-size="sm"
    value="Acme widgets"
    aria-label="Item name"
    autofocus>
  <button class="hc-button" data-size="sm" data-variant="primary" type="submit">
    Save
  </button>
  <button class="hc-button" data-size="sm" type="button"
    data-hx-get="/items/42/name"
    data-hx-target="closest form"
    data-hx-swap="outerHTML">
    Cancel
  </button>
</form>

<!-- 3. Edit state with a validation error (PUT returned 422; the
        htmx:beforeSwap allowance in contract.md lets it swap). Same
        id so the outerHTML swap targets the same node. -->
<form
  id="item-42-name"
  data-hx-put="/items/42/name"
  data-hx-target="this"
  data-hx-swap="outerHTML">
  <div class="hc-field" data-invalid="true">
    <input
      class="hc-input"
      data-size="sm"
      name="name"
      value=""
      aria-label="Item name"
      aria-invalid="true"
      aria-describedby="item-42-name-error">
    <p id="item-42-name-error" class="hc-field__message">Name is required.</p>
  </div>
  <button class="hc-button" data-size="sm" data-variant="primary" type="submit">
    Save
  </button>
  <button class="hc-button" data-size="sm" type="button"
    data-hx-get="/items/42/name"
    data-hx-target="closest form"
    data-hx-swap="outerHTML">
    Cancel
  </button>
</form>
