name: Release

on:
  push:
    # v* releases @hypermedia-components/core; cli-v* releases
    # @hypermedia-components/cli; editor-kit-v* releases
    # @hypermedia-components/editor-kit. Versions are independent.
    tags: ['v*', 'cli-v*', 'editor-kit-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # write so the job can create the matching GitHub Release after a
      # successful publish (the npm publish itself uses OIDC, not this).
      contents: write
      # OIDC for npm trusted publishing (no token; provenance attached
      # automatically). The trusted publisher is configured on npmjs.com
      # for this repo + this workflow file (release.yml).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # Route the tag to its package, require the tag to match the
      # package version, then derive the npm dist-tag from the version so
      # pre-releases never move `latest`: 0.0.1-alpha.0 -> alpha,
      # 0.0.1-beta.2 -> beta, 0.0.1-rc.0 -> rc, plain 0.0.1 -> latest.
      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == cli-v* ]]; then
            FILTER="@hypermedia-components/cli"
            DIR="packages/cli"
          elif [[ "$GITHUB_REF_NAME" == editor-kit-v* ]]; then
            FILTER="@hypermedia-components/editor-kit"
            DIR="packages/editor-kit"
          else
            FILTER="@hypermedia-components/core"
            DIR="packages/core"
          fi
          VERSION=$(node -p "require('./$DIR/package.json').version")
          EXPECTED="${GITHUB_REF_NAME#cli-}"
          EXPECTED="${EXPECTED#editor-kit-}"
          EXPECTED="${EXPECTED#v}"
          if [[ "$VERSION" != "$EXPECTED" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match $DIR version $VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"   # strip "<x.y.z>-"
            TAG="${PRERELEASE%%.*}"      # keep the label before the first dot
          else
            TAG="latest"
          fi
          echo "Publishing $FILTER@$VERSION under dist-tag '$TAG'"
          pnpm --filter "$FILTER" publish --access public --no-git-checks --tag "$TAG"
        # No NODE_AUTH_TOKEN: pnpm exchanges the workflow's OIDC token with
        # npm (trusted publishing). Renaming this file breaks the trust —
        # update the publisher config on npmjs.com if it ever moves.
        # All three packages (core, cli, editor-kit) have their trusted
        # publisher registered on npmjs.com (same repo, same workflow
        # file). editor-kit's first publish (0.0.1) used a temporary
        # granular token — new packages can't pre-register a publisher —
        # which has since been removed.

      # Mirror the npm publish with a GitHub Release so the Releases page
      # stays the human-readable record of what shipped (the convention
      # every prior v* tag followed, previously created by hand). Runs
      # only after a successful publish. Core (v*) releases pull their
      # notes from the matching CHANGELOG section and are marked Latest;
      # CLI (cli-v*) releases use auto-generated notes and never take over
      # the repo's Latest pointer. Re-runs on an existing tag are a no-op.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          VERSION="${TAG#cli-}"
          VERSION="${VERSION#editor-kit-}"
          VERSION="${VERSION#v}"

          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            FLAGS+=(--prerelease --latest=false)   # pre-release: never Latest
          elif [[ "$TAG" == cli-v* || "$TAG" == editor-kit-v* ]]; then
            FLAGS+=(--latest=false)                 # satellites: don't usurp core's Latest
          else
            FLAGS+=(--latest)                        # stable core release
          fi

          NOTES=(--generate-notes)
          if [[ "$TAG" != cli-v* && "$TAG" != editor-kit-v* ]]; then
            # Core: lift the matching CHANGELOG section verbatim. index()==1
            # anchors on the heading start so the version's dots are literal,
            # and the next "## [" ends the section.
            SECTION=$(awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { f = 1; next }
              f && /^## \[/ { exit }
              f { print }
            ' CHANGELOG.md)
            if [ -n "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
              {
                printf '%s\n\n' "$SECTION"
                printf 'Full details in [`CHANGELOG.md`](https://github.com/%s/blob/main/CHANGELOG.md).\n' "$GITHUB_REPOSITORY"
              } > release-notes.md
              NOTES=(--notes-file release-notes.md)
            fi
          fi

          if [[ "$TAG" == cli-v* ]]; then
            TITLE="@hypermedia-components/cli $VERSION"
          elif [[ "$TAG" == editor-kit-v* ]]; then
            TITLE="@hypermedia-components/editor-kit $VERSION"
          else
            TITLE="v$VERSION"
          fi

          echo "Creating GitHub Release $TAG (title: $TITLE)"
          gh release create "$TAG" --verify-tag --title "$TITLE" "${FLAGS[@]}" "${NOTES[@]}"
