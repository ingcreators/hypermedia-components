name: Release

on:
  push:
    # v* releases @hypermedia-components/core; cli-v* releases
    # @hypermedia-components/cli. Versions are independent.
    tags: ['v*', 'cli-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # checkout only — publishing writes to npm, not to the repo
      contents: read
      # OIDC for npm trusted publishing (no token; provenance attached
      # automatically). The trusted publisher is configured on npmjs.com
      # for this repo + this workflow file (release.yml).
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # Route the tag to its package, require the tag to match the
      # package version, then derive the npm dist-tag from the version so
      # pre-releases never move `latest`: 0.0.1-alpha.0 -> alpha,
      # 0.0.1-beta.2 -> beta, 0.0.1-rc.0 -> rc, plain 0.0.1 -> latest.
      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == cli-v* ]]; then
            FILTER="@hypermedia-components/cli"
            DIR="packages/cli"
          else
            FILTER="@hypermedia-components/core"
            DIR="packages/core"
          fi
          VERSION=$(node -p "require('./$DIR/package.json').version")
          EXPECTED="${GITHUB_REF_NAME#cli-}"
          EXPECTED="${EXPECTED#v}"
          if [[ "$VERSION" != "$EXPECTED" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match $DIR version $VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"   # strip "<x.y.z>-"
            TAG="${PRERELEASE%%.*}"      # keep the label before the first dot
          else
            TAG="latest"
          fi
          echo "Publishing $FILTER@$VERSION under dist-tag '$TAG'"
          pnpm --filter "$FILTER" publish --access public --no-git-checks --tag "$TAG"
        # No NODE_AUTH_TOKEN: pnpm exchanges the workflow's OIDC token with
        # npm (trusted publishing). Renaming this file breaks the trust —
        # update the publisher config on npmjs.com if it ever moves.
        # The CLI package needs its own trusted-publisher registration on
        # npmjs.com (same repo, same workflow file) before its first
        # cli-v* tag is pushed.
