name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # checkout only — publishing writes to npm, not to the repo
      contents: read
      # OIDC for npm trusted publishing (no token; provenance attached
      # automatically). The trusted publisher is configured on npmjs.com
      # for this repo + this workflow file (release.yml).
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # Derive the npm dist-tag from the package version so pre-releases never
      # move `latest`: 0.0.1-alpha.0 -> alpha, 0.0.1-beta.2 -> beta,
      # 0.0.1-rc.0 -> rc, and a plain 0.0.1 -> latest.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"   # strip "<x.y.z>-"
            TAG="${PRERELEASE%%.*}"      # keep the label before the first dot
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION under dist-tag '$TAG'"
          pnpm --filter @hypermedia-components/core publish --access public --no-git-checks --tag "$TAG"
        # No NODE_AUTH_TOKEN: pnpm exchanges the workflow's OIDC token with
        # npm (trusted publishing). Renaming this file breaks the trust —
        # update the publisher config on npmjs.com if it ever moves.
