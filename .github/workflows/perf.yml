name: Perf (Lighthouse)

# Weekly Lighthouse scores for the DEPLOYED docs site. Deliberately not a
# PR gate: PRs measure nothing here — the deployed site is what users get,
# and scheduled runs catch regressions without blocking merges. A failed
# run means a budget was missed (see BUDGET below).

on:
  schedule:
    - cron: '0 21 * * 1' # Mondays 21:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the failure step files / updates a tracking issue

env:
  BASE: https://hypermedia-components.ichimura-12c.workers.dev/hypermedia-components
  # Minimum category scores (0-100). Baselines on 2026-06-12 were 92-100
  # (see apps/docs reference/performance page); 90 leaves headroom for
  # network noise while still catching real regressions.
  BUDGET: '90'

jobs:
  lighthouse:
    name: Lighthouse (deployed docs)
    runs-on: ubuntu-latest
    steps:
      - name: Measure key pages
        run: |
          mkdir -p reports
          for entry in \
            "landing|/" \
            "button|/components/button/" \
            "kitchen-sink|/kitchen-sink/" \
            "blocks|/blocks/" \
            "theme-builder|/tokens/theme-builder/"; do
            name="${entry%%|*}"; path="${entry##*|}"
            echo "::group::$name ($BASE$path)"
            # Re-measure a page that misses the budget before believing it.
            # Every observed failure (2026-06-15, 07-13, 07-20) was the
            # first-measured page picking up runner cold-start noise — the
            # identical deploy re-scored 97 a week later. A real regression
            # fails all three attempts; noise clears on a retry.
            for attempt in 1 2 3; do
              npx --yes lighthouse@12 "$BASE$path" \
                --chrome-flags="--headless=new --no-sandbox" \
                --only-categories=performance,accessibility,best-practices,seo \
                --skip-audits=full-page-screenshot \
                --output=json --output-path="reports/$name.json" --quiet
              lowest=$(node -p 'Math.min(...Object.values(require(`./reports/${process.argv[1]}.json`).categories).map((c) => Math.round((c.score ?? 0) * 100)))' "$name")
              if [ "$lowest" -ge "$BUDGET" ]; then break; fi
              echo "attempt $attempt: lowest category score $lowest is below $BUDGET"
            done
            echo "::endgroup::"
          done

      - name: Summarize and enforce the budget
        run: |
          node - <<'EOF'
          const { readdirSync, readFileSync, appendFileSync } = require('node:fs');
          const budget = Number(process.env.BUDGET);
          const rows = [];
          let failed = false;
          for (const file of readdirSync('reports').sort()) {
            const r = JSON.parse(readFileSync(`reports/${file}`, 'utf8'));
            const c = Object.fromEntries(
              Object.entries(r.categories).map(([k, v]) => [k, Math.round((v.score ?? 0) * 100)]),
            );
            const a = r.audits;
            const under = Object.entries(c).filter(([, score]) => score < budget);
            if (under.length) failed = true;
            rows.push(
              `| ${file.replace('.json', '')} | ${c.performance} | ${c.accessibility} | ` +
                `${c['best-practices']} | ${c.seo} | ${a['largest-contentful-paint'].displayValue} | ` +
                `${a['cumulative-layout-shift'].displayValue} | ${a['total-blocking-time'].displayValue} |` +
                (under.length ? ` ⚠ below ${budget}: ${under.map(([k]) => k).join(', ')}` : ''),
            );
          }
          const table = [
            `## Lighthouse — deployed docs (budget: every category ≥ ${budget})`,
            '',
            '| Page | Perf | A11y | Best practices | SEO | LCP | CLS | TBT |',
            '| --- | --- | --- | --- | --- | --- | --- | --- |',
            ...rows,
          ].join('\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, table + '\n');
          console.log(table);
          if (failed) {
            console.error(`\nBudget missed (a category scored below ${budget}).`);
            process.exit(1);
          }
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: reports/
          retention-days: 30

      # Mirror of the failure step below: once a run is green again, an open
      # tracking issue is stale (the 2026-07-13 issue outlived its 07-27
      # recovery by two weeks because nothing closed it).
      - name: Close the tracking issue on success
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly Lighthouse run failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered: this run passed the budget on every page: $RUN_URL"
          fi

      # Scheduled runs have no PR to go red on — without this, a missed
      # budget (or a crashed run) is only visible to someone reading the
      # Actions tab (the 2026-06-15 failure went unnoticed for a week).
      # One open tracking issue at a time: comment if it already exists.
      - name: File a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly Lighthouse run failed"
          body="The Lighthouse run failed — a category scored below the budget, or the run itself crashed. See the run for the score table (step summary) and the JSON reports (artifact): $RUN_URL"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
