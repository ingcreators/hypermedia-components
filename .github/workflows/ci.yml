name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint + Stylelint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint JS + CSS
        run: pnpm --filter @hypermedia-components/core lint

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages/core
        run: pnpm --filter @hypermedia-components/core build

      - name: Type-check public surface
        run: pnpm --filter @hypermedia-components/core typecheck

      - name: Run Vitest
        run: pnpm --filter @hypermedia-components/core test

      - name: Run docs demo-API Vitest
        run: pnpm --filter @hypermedia-components/docs test

      - name: Run CLI Vitest
        run: pnpm --filter @hypermedia-components/cli test

      - name: Run CLI tests
        run: pnpm --filter @hypermedia-components/cli test

  docs:
    name: Docs build (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # A PR that changes an English docs page must change its ja/ twin
      # in the same PR (CONTRIBUTING.md § "Japanese translations").
      # Cheap (git + node only), so it runs before the build.
      - name: Docs i18n drift check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          node apps/docs/scripts/check-i18n-drift.mjs ${{ github.event.pull_request.base.sha }} HEAD

      - run: pnpm install --frozen-lockfile

      # `pnpm docs:build` chains: core build → astro build → pagefind → sitemap.
      - name: Build docs site
        run: pnpm -w run docs:build

      - name: Upload built docs as artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 7

  # One leg per engine; the VRT screenshot sheets only run (and assert)
  # on the Chromium leg — see playwright.config.mjs projects.
  browser:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # WebKit runs the suite noticeably slower than Chromium; 15 was
    # enough for one engine but cancels the webkit leg mid-suite.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache the Playwright browsers separately from pnpm.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install ${{ matrix.browser }}
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @hypermedia-components/core exec playwright install --with-deps ${{ matrix.browser }}

      - name: Install ${{ matrix.browser }} system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @hypermedia-components/core exec playwright install-deps ${{ matrix.browser }}

      - name: Run Playwright (${{ matrix.browser }})
        run: pnpm --filter @hypermedia-components/core test:browser --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/core/playwright-report
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: packages/core/test-results
          retention-days: 7

  # The branch ruleset requires a check named "Browser tests
  # (Playwright)"; this gate keeps that contract while the real work
  # fans out across the matrix above. `if: always()` because a skipped
  # required check would count as satisfied.
  browser-gate:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: browser
    if: always()
    steps:
      - name: Require every browser leg to succeed
        run: test "${{ needs.browser.result }}" = "success"
