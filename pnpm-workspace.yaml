packages:
  - "apps/*"
  - "packages/*"

# Allow native postinstall scripts for trusted dependencies required by Astro.
allowBuilds:
  esbuild: true
  sharp: true

# Security floors for transitive dev-toolchain deps (Dependabot alerts;
# build/lint/docs tooling only — nothing here ships in the published
# packages). Range-scoped so they self-retire once parents catch up:
# each override only rewrites specs that still resolve below the floor.
overrides:
  "nanoid@<3.3.18": "^3.3.18" # GHSA-2v37-7h3g-55p8 (patched floor raised 3.3.17 → 3.3.18)
  "js-yaml@>=4.0.0 <4.3.1": "^4.3.1" # GHSA-5p4m-2wfm-xmqj
  "fast-uri@>=3.0.0 <3.1.8": "^3.1.8" # GHSA-fph4-wmhf-6fwf / -5jgf-p345-68v8 / -f65p-4m7j-42xc / -jqff-g426-hqxp / -hrr3-gc8f-f4qj
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12" # GHSA-6j4f-fj2g-mc7p / -qhr7-859c-m2p7 / -q2hr-2g5m-vwhr
  "postcss-selector-parser@<7.1.6": "^7.1.6" # GHSA-rj75-hqrm-r3gf
