<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The kit's mark: the default accent (oklch 0.54 0.215 264.4 ≈ this
       sRGB blue) behind a lowercase "hc" — the class prefix itself. -->
  <rect width="32" height="32" rx="7" fill="#3b5bdb"/>
  <rect width="32" height="32" rx="7" fill="oklch(0.54 0.215 264.4)"/>
  <text x="16" y="21.5" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="13.5" font-weight="700" fill="#fff">hc</text>
</svg>
