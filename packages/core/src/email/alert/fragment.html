<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" th:fragment="hcAlertInfo(title, text)">
  <tr>
    <td bgcolor="{alert-info-bg}" style="background-color:{alert-info-bg};border:{alert-border-width} solid {alert-info-border};border-radius:{alert-radius};padding:{alert-padding-block} {alert-padding-inline};">
      <p style="margin:0;font-family:{font-family-sans};font-size:{font-size-md};font-weight:{alert-title-weight};line-height:1.4;color:{alert-info-fg};" th:text="${title}">Info title</p>
      <p style="margin:{space-1} 0 0 0;font-family:{font-family-sans};font-size:{font-size-sm};line-height:1.6;color:{alert-info-fg};" th:text="${text}">Info body copy.</p>
    </td>
  </tr>
</table>
