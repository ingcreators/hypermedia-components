<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hc-range fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main id="section-range" style="padding:1rem; max-inline-size:32rem; display:grid; gap:1.5rem;">
    <h1>Range</h1>

    <form data-testid="form">
      <div class="hc-range" data-testid="range" style="inline-size:20rem;">
        <input class="hc-range__input" type="range" id="low" name="price_min"
               min="0" max="100" value="20" aria-label="Minimum price">
        <input class="hc-range__input" type="range" id="high" name="price_max"
               min="0" max="100" value="80" aria-label="Maximum price">
      </div>
    </form>

    <div class="hc-range" data-testid="ssr" style="--hc-range-low: 30; --hc-range-high: 60; inline-size:20rem;">
      <input class="hc-range__input" type="range" name="a_min" min="0" max="100" value="30" aria-label="Min">
      <input class="hc-range__input" type="range" name="a_max" min="0" max="100" value="60" aria-label="Max">
    </div>
  </main>
</body>
</html>
