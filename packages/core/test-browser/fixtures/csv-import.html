<!doctype html>
<!-- Fixture for the csv-import recipe — the file-upload form shape
     posting a CSV against the serve.mjs mock. Pins: the validation
     report (summary + real error table + tokened confirm form) with
     nothing imported, the commit (result summary + toast), the
     nothing-valid 422 with no confirm form, and the single-shot 409
     via a pre-rendered stale confirm form (canned token "expired").
     The inline script is the consolidated [409, 422] beforeSwap
     allowance the contract documents. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>csv-import fixture</title>
  <link rel="stylesheet" href="/hc.tokens.css">
  <link rel="stylesheet" href="/hc.css">
  <script src="/htmx.min.js" defer></script>
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main class="hc-stack" style="padding:1rem; max-inline-size:40rem;">
    <h1>CSV import</h1>

    <form id="csv-upload" method="post" action="/mock/csv-import/imports"
          enctype="multipart/form-data"
          data-hx-post="/mock/csv-import/imports"
          data-hx-encoding="multipart/form-data"
          data-hx-target="#import-report"
          data-hx-indicator="find progress"
          data-hx-disabled-elt="find button[type=submit]">
      <div class="hc-field">
        <label class="hc-field__label" for="csv">CSV file</label>
        <input class="hc-input" id="csv" name="csv" type="file" required
               accept=".csv,text/csv" data-testid="csv">
      </div>

      <progress class="hc-progress htmx-indicator" data-hc-upload-progress
                value="0" max="100" aria-label="Upload progress"
                data-testid="bar"></progress>

      <button class="hc-button" data-variant="primary" type="submit"
              data-testid="upload">Upload</button>
    </form>

    <div id="import-report" aria-live="polite" data-testid="report"></div>

    <!-- An earlier report's confirm form whose single-shot token was
         already consumed — clicking it pins the 409 re-upload branch. -->
    <form method="post" action="/mock/csv-import/imports/expired/commit"
          data-hx-post="/mock/csv-import/imports/expired/commit"
          data-hx-target="#import-report"
          data-hx-disabled-elt="find button[type=submit]">
      <input type="hidden" name="token" value="expired">
      <button class="hc-button" type="submit" data-testid="stale-commit">
        Commit an already-consumed token
      </button>
    </form>

    <div class="hc-toast-region" data-hc-toast-region data-position="bottom-right"
         role="region" aria-label="Notifications"></div>
  </main>

  <script>
    // The consolidated page-level allowance ([401, 409, 422] — the
    // fixture exercises 409 and 422): htmx ≥ 2 won't swap non-2xx.
    document.body.addEventListener('htmx:beforeSwap', (event) => {
      if ([409, 422].includes(event.detail.xhr.status)) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
      }
    });
  </script>
</body>
</html>
