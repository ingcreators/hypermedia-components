<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hc calendar month/year nav fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main style="padding:1rem;">
    <!-- Pinned to May 2026 so navigation is deterministic. -->
    <div class="hc-calendar" data-value="2026-05-15" data-first-day="0"
         data-locale="en-US" data-nav="select" aria-label="Pick a date"
         data-testid="cal"></div>
  </main>
</body>
</html>
