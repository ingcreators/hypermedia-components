<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>streaming-response recipe fixture</title>
  <!--
    Pins the blessed streaming-response composition against real htmx +
    the vendored SSE extension: the composer POST (chat-messages
    contract, ?stream=1) returns a placeholder that owns the SSE
    connection; `chunk` events append into its body while aria-busy
    holds, `done`/`error` outerHTML-swap the final message over it
    (closing the EventSource), and the stop button cancels in one
    round trip. Scenario is picked by the prompt text (fail / slow).
  -->
  <link rel="stylesheet" href="/hc.css">
  <script src="/htmx.min.js" defer></script>
  <script src="/sse.min.js" defer></script>
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main id="section-streaming-response" style="padding:1rem; max-inline-size:40rem;">
    <h1>Chat (streaming)</h1>

    <div class="hc-chat" role="log" aria-label="Conversation" data-testid="chat">
      <ol class="hc-chat__list" tabindex="0" id="chat-list" data-testid="list" style="max-block-size:16rem;">
        <li class="hc-chat__message" data-role="assistant">
          <div class="hc-chat__body">Hello! Ask me anything.</div>
        </li>
      </ol>
      <button class="hc-chat__jump hc-button" data-size="sm" type="button">↓ Latest</button>

      <div id="composer-slot" data-hx-get="/mock/chat/reset?stream=1" data-hx-trigger="load" data-hx-swap="innerHTML"></div>
    </div>
  </main>

  <script>
    // Documented one-time allowance (chat-messages recipe): htmx ≥ 2
    // won't swap non-2xx by default; the 422 re-renders the composer.
    document.body.addEventListener('htmx:beforeSwap', (event) => {
      if (event.detail.xhr.status === 422) event.detail.shouldSwap = true;
    });
  </script>
</body>
</html>
