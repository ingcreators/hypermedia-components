<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hc-code editable fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main id="section-code-editable" style="padding:1rem; max-inline-size:40rem;">
    <h1>Editable code field</h1>

    <form id="editor-form">
      <div class="hc-code" data-editable data-gutter="line-numbers" data-testid="editor">
        <textarea class="hc-code__input" name="content" spellcheck="false"
                  aria-label="Route SQL" data-testid="ta"
                  style="block-size:4rem; min-block-size:0">SELECT id
FROM members
WHERE active = true
ORDER BY id
LIMIT 1
OFFSET 2
-- 7
-- 8
-- 9
-- 10</textarea>
      </div>
      <button type="submit" class="hc-button">Save</button>
    </form>

    <div class="hc-code" data-editable data-testid="plain">
      <textarea class="hc-code__input" name="note" aria-label="Notes">no gutter here</textarea>
    </div>
  </main>
</body>
</html>
