<!doctype html>
<!-- Fixture for a collapsed splitter pane. What is pinned is the two
     things a "collapse" must not do: leave a hole where the pane was
     (its sibling takes the space), and leave the user with no way back
     (the rail keeps the control). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>splitter collapse fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main style="padding:1rem">
    <div class="hc-splitter" data-orientation="horizontal" data-testid="splitter"
         style="block-size: 12rem; inline-size: 40rem;">
      <div class="hc-splitter__panel" data-testid="main">The data</div>
      <div class="hc-splitter__handle" role="separator" tabindex="0"
           data-testid="handle" aria-label="Resize the panel"></div>
      <div class="hc-splitter__panel" data-testid="side" data-collapsed>
        <button class="hc-button" data-size="sm" type="button" data-testid="rail">Reasons (5)</button>
      </div>
    </div>
    <button class="hc-button" type="button" data-testid="expand">Expand</button>
  </main>
  <script type="module">
    document.querySelector('[data-testid="expand"]').addEventListener('click', () => {
      document.querySelector('[data-testid="side"]').removeAttribute('data-collapsed');
    });
  </script>
</body>
</html>
