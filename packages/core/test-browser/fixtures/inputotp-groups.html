<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hc inputotp groups fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main style="padding:1rem; display:flex; flex-direction:column; gap:1.5rem;">
    <div class="hc-inputotp" data-length="6" data-groups="3-3" data-testid="otp33">
      <input class="hc-inputotp__input" type="text" name="otp1"
             aria-label="One-time code" data-testid="otp33-input">
    </div>

    <div class="hc-inputotp" data-length="6" data-groups="2-2-2" data-testid="otp222">
      <input class="hc-inputotp__input" type="text" name="otp2" aria-label="One-time code">
    </div>
  </main>
</body>
</html>
