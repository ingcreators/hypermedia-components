<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hc datagrid lazy detail fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main style="padding:1rem;">
    <div class="hc-datagrid" data-testid="grid">
      <div class="hc-datagrid__scroll">
        <table class="hc-datagrid__table">
          <thead class="hc-datagrid__head">
            <tr>
              <th class="hc-datagrid__headcell" scope="col"><span class="hc-sr-only">Detail</span></th>
              <th class="hc-datagrid__headcell" scope="col">Category</th>
            </tr>
          </thead>
          <tbody class="hc-datagrid__record">
            <tr class="hc-datagrid__row">
              <td class="hc-datagrid__cell">
                <button class="hc-datagrid__toggle" data-hc-datagrid-toggle
                        type="button" aria-label="Toggle detail" data-testid="toggle"></button>
              </td>
              <td class="hc-datagrid__cell">Beverages</td>
            </tr>
            <tr class="hc-datagrid__detail-row">
              <td class="hc-datagrid__detail" data-lazy colspan="2" data-testid="detail"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // Simulate htmx: load the detail content shortly after the behavior fires
    // hc:datagriddetailload (which htmx would normally do via hx-trigger).
    window.__loadCount = 0;
    document.querySelector('.hc-datagrid__detail[data-lazy]')
      .addEventListener('hc:datagriddetailload', (e) => {
        window.__loadCount += 1;
        const cell = e.target;
        const n = window.__loadCount;
        setTimeout(() => {
          cell.innerHTML = '<p data-testid="detail-content">Loaded detail #' + n + '</p>';
        }, 80);
      });
  </script>
</body>
</html>
