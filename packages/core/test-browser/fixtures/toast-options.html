<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hc toast options fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main style="padding:1rem; min-block-size:120vh;">
    <!-- Pre-rendered region: top-centre, capped at 3. -->
    <div class="hc-toast-region" data-hc-toast-region
         data-position="top-center" data-limit="3"
         role="region" aria-label="Notifications" data-testid="region"></div>
  </main>
</body>
</html>
