<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hc reduced-motion fixture</title>
  <link rel="stylesheet" href="/hc.css">
</head>
<body>
  <main style="padding:1rem; display:flex; flex-direction:column; gap:1rem;">
    <button class="hc-button" data-testid="rm-button">Button</button>
    <input class="hc-checkbox" type="checkbox" data-testid="rm-check">
    <input class="hc-radio" type="radio" name="r" data-testid="rm-radio">
    <input class="hc-input" type="text" data-testid="rm-input">
    <select class="hc-select" data-testid="rm-select"><option>One</option></select>
    <input class="hc-datepicker" type="text" data-testid="rm-datepicker">

    <nav class="hc-tabs">
      <a class="hc-tabs__tab" href="#a" aria-current="page" data-testid="rm-tab">Tab</a>
    </nav>

    <nav class="hc-pagination" aria-label="Pagination">
      <a class="hc-pagination__item" href="?p=1" data-testid="rm-page">1</a>
    </nav>

    <div class="hc-toggle-group" role="group">
      <button class="hc-toggle" type="button" aria-pressed="false" data-testid="rm-toggle">Bold</button>
    </div>

    <span class="htmx-indicator" data-testid="rm-htmx">Loading…</span>
  </main>
</body>
</html>
