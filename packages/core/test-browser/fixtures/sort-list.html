<!doctype html>
<!-- Fixture for installSortList — the sort control's ordered keys.
     jsdom does not fire `formdata` when FormData is constructed, so the
     real-browser firing is pinned here for both transports, together
     with the thing that makes the list a control rather than a display:
     reordering it with the KEYBOARD changes what the form sends. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sort-list fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main class="hc-stack" style="padding:1rem; max-inline-size: 32rem;">
    <h1>Sort</h1>
    <form id="sort-form" action="/orders" method="get" data-testid="form">
      <input type="hidden" name="f-status" value="open">

      <ul class="hc-stack" data-hc-sortable data-hc-sort-list="sort" data-testid="list">
        <li class="hc-item" data-hc-sortable-id="ship" data-hc-sort-key="ship">
          <button class="hc-button" data-variant="ghost" type="button"
                  data-hc-sortable-handle data-testid="handle-ship"
                  aria-label="Reorder Ship date">⠿</button>
          <span class="hc-item__title">Ship date</span>
          <select class="hc-select" name="dir-ship" data-testid="dir-ship"
                  aria-label="Ship date direction">
            <option value="asc">Ascending</option>
            <option value="desc" selected>Descending</option>
          </select>
        </li>
        <li class="hc-item" data-hc-sortable-id="order" data-hc-sort-key="order">
          <button class="hc-button" data-variant="ghost" type="button"
                  data-hc-sortable-handle data-testid="handle-order"
                  aria-label="Reorder Order">⠿</button>
          <span class="hc-item__title">Order</span>
          <select class="hc-select" name="dir-order" aria-label="Order direction">
            <option value="asc" selected>Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </li>
      </ul>

      <input type="hidden" name="page-size" value="40">
      <button class="hc-button" data-variant="primary" type="submit"
              data-testid="apply">Apply</button>
    </form>
  </main>
</body>
</html>
