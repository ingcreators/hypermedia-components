<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hc validation fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main style="padding:1rem; max-inline-size:28rem;">
    <form id="form" onsubmit="event.preventDefault(); window.__submitted = true;">
      <div class="hc-field">
        <label class="hc-field__label" for="email" data-testid="email-label">Email</label>
        <input class="hc-input" id="email" name="email" type="email" required
               aria-describedby="email-help" data-testid="email">
        <p class="hc-field__message" id="email-help" data-testid="email-help">
          We never share it.
        </p>
      </div>

      <div class="hc-field" style="margin-block-start:1rem;">
        <label class="hc-field__label" for="nickname" data-testid="nick-label">Nickname</label>
        <input class="hc-input" id="nickname" name="nickname" data-testid="nick">
      </div>

      <button type="submit" class="hc-button" data-variant="primary"
              data-testid="submit" style="margin-block-start:1rem;">Submit</button>
    </form>
  </main>
</body>
</html>
