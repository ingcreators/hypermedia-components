<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hc-datagrid fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body style="margin: 0; padding: 1rem;">
  <!-- Constrained box so both axes scroll, exercising sticky header + frozen columns.
       Frozen columns set fixed widths and matching --hc-datagrid-left offsets. -->
  <div class="hc-datagrid" data-testid="grid" style="--hc-datagrid-max-height: 180px; max-inline-size: 460px;">
    <template data-datagrid-editor data-col="alpha">
      <input class="hc-input" type="text" aria-label="Alpha value">
    </template>
    <template data-datagrid-editor data-col="beta">
      <select class="hc-select" aria-label="Beta value">
        <option value="x">X</option>
        <option value="y">Y</option>
        <option value="z">Z</option>
      </select>
    </template>
    <template data-datagrid-editor data-col="gamma">
      <div class="hc-combobox">
        <input class="hc-combobox__input hc-input" type="text" role="combobox"
               aria-haspopup="listbox" aria-controls="dg-gamma-list" aria-label="Gamma code" autocomplete="off">
        <ul class="hc-combobox__listbox" id="dg-gamma-list" role="listbox" popover>
          <li class="hc-combobox__option" role="option" data-value="001">コードA</li>
          <li class="hc-combobox__option" role="option" data-value="002">コードB</li>
          <li class="hc-combobox__option" role="option" data-value="003">コードC</li>
        </ul>
      </div>
    </template>
    <div class="hc-datagrid__scroll" data-testid="scroll">
      <table class="hc-datagrid__table">
        <thead class="hc-datagrid__head">
          <tr>
            <th class="hc-datagrid__headcell" data-frozen rowspan="2"
                style="--hc-datagrid-left: 0; width: 36px;" scope="col" data-testid="corner-check">
              <input type="checkbox" class="hc-checkbox" aria-label="Select all">
            </th>
            <th class="hc-datagrid__headcell" data-frozen data-frozen-edge rowspan="2"
                style="--hc-datagrid-left: 36px; width: 56px;" scope="col" data-testid="corner-id">ID</th>
            <th class="hc-datagrid__headcell" colspan="3" data-testid="group-a">Group A</th>
            <th class="hc-datagrid__headcell" colspan="3">Group B</th>
          </tr>
          <tr>
            <th class="hc-datagrid__headcell" scope="col" data-testid="leaf-a1">Alpha</th>
            <th class="hc-datagrid__headcell" scope="col">Beta</th>
            <th class="hc-datagrid__headcell" scope="col">Gamma</th>
            <th class="hc-datagrid__headcell" scope="col" style="width: 7rem;">Delta</th>
            <th class="hc-datagrid__headcell" scope="col">Epsilon</th>
            <th class="hc-datagrid__headcell" scope="col">Zeta</th>
          </tr>
        </thead>
        <tbody class="hc-datagrid__body" id="grid-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Build 14 rows so the body scrolls vertically; wide cells force
    // horizontal scroll.
    const body = document.getElementById('grid-body');
    let html = '';
    for (let r = 1; r <= 14; r += 1) {
      html += '<tr class="hc-datagrid__row" data-testid="row-' + r + '">';
      html += '<td class="hc-datagrid__cell" data-frozen style="--hc-datagrid-left:0;width:36px;">'
        + '<input type="checkbox" class="hc-checkbox" aria-label="Select row ' + r + '"></td>';
      html += '<th class="hc-datagrid__cell" data-frozen data-frozen-edge scope="row" '
        + 'style="--hc-datagrid-left:36px;width:56px;" data-testid="cell-id-' + r + '">' + r + '</th>';
      // Alpha = editable text, Beta = editable select, Gamma = editable combobox.
      html += '<td class="hc-datagrid__cell" data-testid="cell-Alpha-' + r + '" data-editable data-col="alpha">Alpha ' + r + '</td>';
      html += '<td class="hc-datagrid__cell" data-testid="cell-Beta-' + r + '" data-editable data-col="beta" data-value="x">X</td>';
      html += '<td class="hc-datagrid__cell" data-testid="cell-Gamma-' + r + '" data-editable data-col="gamma" data-value="001">コードA</td>';
      // Delta = fixed-width truncating column (ellipsis + overflow tooltip).
      html += '<td class="hc-datagrid__cell" data-testid="cell-Delta-' + r + '">'
        + '<span class="hc-datagrid__truncate" style="max-inline-size:7rem;">Delta ' + r + ' very long content xxxxxxxxxxxxxxxxxxxx</span></td>';
      for (const c of ['Epsilon', 'Zeta']) {
        html += '<td class="hc-datagrid__cell" data-testid="cell-' + c + '-' + r + '">'
          + c + ' value ' + r + ' (wide content)</td>';
      }
      html += '</tr>';
    }
    body.innerHTML = html;
  </script>
</body>
</html>
