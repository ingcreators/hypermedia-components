<!doctype html>
<!-- Fixture for the O(1) CHROME rule: a bulk-error report is unbounded
     content (one group per failure reason), and the full-height list
     page gives the grid whatever the chrome leaves. Render fifteen
     reasons into an unbounded chrome region and the grid is squeezed to
     nothing — on the exact screen whose rows the report is telling the
     user to go and fix.

     The region is therefore BOUNDED and scrolls itself.

     It pins the two minimums that make it work. A flex item will not
     shrink below its content on either axis, and the datagrid's table
     is `max-content` wide, so without them the page column grows to the
     table's size and hc-shell__main scrolls instead of the grid,
     carrying the chrome with it. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bulk report height fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
  <style>
    html, body { margin: 0; block-size: 100%; }

    .app-main {
      display: flex;
      min-block-size: 0;
      min-inline-size: 0;
    }

    .page {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-block-size: 0;
      min-inline-size: 0;
      gap: var(--hc-space-3);
      padding: var(--hc-space-3);
    }

    /* The backstop: unbounded server content, bounded region. */
    .report {
      max-block-size: min(25vh, 12rem);
      overflow: auto;
    }

    .page > .hc-datagrid {
      flex: 1;
      min-block-size: 0;
      min-inline-size: 0;

      --hc-datagrid-max-height: 100%;
    }
  </style>
</head>
<body>
  <div class="hc-shell" data-testid="shell">
    <header class="hc-shell__header">Orders</header>
    <nav class="hc-shell__sidebar" aria-label="Primary">
      <a href="#grid">Orders</a>
    </nav>
    <main class="hc-shell__main app-main" data-testid="main">
      <div class="page" data-testid="page">
        <div class="hc-cluster">
          <h1 style="margin:0">Orders</h1>
          <span class="hc-chip">Carrier: Road</span>
        </div>

        <!-- The one-line summary is what the chrome carries: constant
             height, whatever N is. -->
        <div class="hc-alert" data-variant="warning" role="status" data-testid="summary">
          <p><strong>12 of 40 rows could not be updated.</strong>
            <a href="#grid">Show only failed (12)</a></p>
        </div>

        <!-- The detail, deliberately rendered the OLD way (in the
             chrome) so the bound is what is under test. -->
        <div class="report" id="bulk-report" data-testid="report" aria-live="polite"></div>
        <div class="hc-toolbar" role="toolbar" aria-label="Order actions" data-testid="toolbar">
          <button class="hc-button" data-variant="ghost" type="button">Refresh</button>
          <hr role="separator" aria-orientation="vertical">
          <span data-hc-spacer="true"></span>
          <span>4,901–4,940 of 5,000</span>
        </div>

        <div class="hc-datagrid" id="grid" data-testid="grid">
          <div class="hc-datagrid__scroll" data-testid="scroll">
            <table class="hc-datagrid__table">
              <thead class="hc-datagrid__head">
                <tr>
                  <th class="hc-datagrid__headcell" data-frozen data-frozen-edge scope="col"
                      data-testid="head-frozen"
                      style="--hc-datagrid-left: 0; inline-size: 7rem;">Order</th>
                </tr>
              </thead>
              <tbody class="hc-datagrid__body" id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    // Fifteen distinct reasons — the shape that squeezed the grid out.
    document.getElementById('bulk-report').innerHTML = `
      <table class="hc-table"><tbody>${Array.from(
        { length: 15 },
        (_, i) => `<tr><th scope="row">Reason ${i + 1} — a sentence long enough to wrap on a narrow panel</th><td>${i + 2} rows</td></tr>`,
      ).join('')}</tbody></table>`;

    // Wide and long, so both axes really overflow the grid's viewport.
    const COLS = 24;
    const head = document.querySelector('.hc-datagrid__head > tr');
    for (let c = 0; c < COLS; c += 1) {
      const th = document.createElement('th');
      th.className = 'hc-datagrid__headcell';
      th.scope = 'col';
      th.textContent = `Column ${c} with a long label`;
      head.append(th);
    }
    document.getElementById('rows').innerHTML = Array.from({ length: 120 }, (_, r) => `
      <tr class="hc-datagrid__row" id="row-${r}">
        <th class="hc-datagrid__cell" data-frozen data-frozen-edge scope="row"
            style="--hc-datagrid-left: 0;">SO-${4901 + r}</th>
        ${Array.from({ length: COLS }, (_, c) => `<td class="hc-datagrid__cell">value ${r}-${c}</td>`).join('')}
      </tr>`).join('');
  </script>
</body>
</html>
