<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hc-chat fixture</title>
  <link rel="stylesheet" href="/hc.css">
  <script type="module" src="/hc.behaviors.js"></script>
</head>
<body>
  <main style="padding:1rem; max-inline-size:40rem;">
    <h1>Chat transcript</h1>

    <div class="hc-chat" data-testid="chat" role="log" aria-label="Conversation">
      <ol class="hc-chat__list" data-testid="list" tabindex="0" style="max-block-size:14rem;">
        <li class="hc-chat__message" data-role="user" data-testid="m-user">
          <span class="hc-avatar" data-size="sm"><span class="hc-avatar__initials" aria-hidden="true">AB</span></span>
          <div class="hc-chat__body">Show me the failing checks.</div>
          <div class="hc-chat__meta"><time datetime="2026-07-05T09:00">09:00</time></div>
        </li>
        <li class="hc-chat__message" data-role="system" data-testid="m-system">
          <div class="hc-chat__body">Context switched to project “ops”.</div>
        </li>
        <li class="hc-chat__message" data-role="assistant" data-testid="m-assistant">
          <div class="hc-chat__body">
            <p>Two checks are red:</p>
            <pre class="hc-code"><code>lint: ok
unit: FAIL</code></pre>
          </div>
          <div class="hc-chat__meta"><time datetime="2026-07-05T09:01">09:01</time></div>
        </li>
        <li class="hc-chat__message" data-role="assistant" data-state="streaming" aria-busy="true" data-testid="m-streaming">
          <div class="hc-chat__body" data-testid="stream-body">The unit failure is</div>
        </li>
      </ol>
      <button class="hc-chat__jump hc-button" data-size="sm" type="button" data-testid="jump">↓ Latest</button>
    </div>

    <h1>Attachments</h1>

    <ul class="hc-attachments" aria-label="Attachments" data-testid="attachments">
      <li class="hc-attachment" data-testid="att-settled">
        <span class="hc-attachment__icon" aria-hidden="true">📄</span>
        <span class="hc-attachment__name">notes.md</span>
        <span class="hc-attachment__size">4 KB</span>
        <button class="hc-attachment__remove" type="button" aria-label="Remove notes.md">×</button>
      </li>
      <li class="hc-attachment" data-state="uploading" data-testid="att-uploading">
        <span class="hc-attachment__icon" aria-hidden="true">📄</span>
        <span class="hc-attachment__name">report.pdf</span>
        <span class="hc-attachment__size">1.2 MB</span>
        <progress class="hc-progress hc-attachment__progress" max="100" value="40" aria-label="Uploading report.pdf"></progress>
        <button class="hc-attachment__remove" type="button" aria-label="Remove report.pdf">×</button>
      </li>
      <li class="hc-attachment" data-state="error" data-testid="att-error">
        <span class="hc-attachment__icon" aria-hidden="true">📄</span>
        <span class="hc-attachment__name">huge.iso</span>
        <span class="hc-attachment__size">9.8 GB</span>
        <button class="hc-attachment__remove" type="button" aria-label="Remove huge.iso">×</button>
      </li>
    </ul>
  </main>
</body>
</html>
